[project]
name = "retentionos-backend"
version = "0.1.0"
description = "RetentionOS backend (Django + DRF)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "django-allauth[mfa,socialaccount]>=65.0",
  "django-cors-headers>=4.4",
  "psycopg[binary,pool]>=3.2",
  "celery[redis]>=5.5",
  "django-celery-beat>=2.7",
  "redis>=5.0",
  "structlog>=24.4",
  "sentry-sdk>=2.18",
  "numpy>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "ruff>=0.6",
  "mypy>=1.13",
  "django-stubs[compatible-mypy]>=5.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

# Type checking (technical.md §2.2). Not --strict for M0: functions without type hints are
# still checked inside (check_untyped_defs), but hints are not yet required everywhere.
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ['(^|/)\.venv/', '(^|/)migrations/', '(^|/)tmp/', '(^|/)staticfiles/']

# These libraries ship without type information, and no stubs are installed for them.
[[tool.mypy.overrides]]
module = ["rest_framework.*", "allauth.*", "celery.*", "django_celery_beat.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
