[project]
name = "retentionos-backend"
version = "0.1.0"
description = "RetentionOS backend (Django + DRF)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "django-allauth[mfa,socialaccount]>=65.0",
  "django-cors-headers>=4.4",
  "psycopg[binary,pool]>=3.2",
  "celery[redis]>=5.5",
  "django-celery-beat>=2.7",
  "redis>=5.0",
  "structlog>=24.4",
  "sentry-sdk>=2.18",
  "numpy>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "ruff>=0.6",
  "mypy>=1.13",
  "django-stubs[compatible-mypy]>=5.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
