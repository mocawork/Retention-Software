# RetentionOS local development stack (technical.md §3.2). Local use only: staging and
# production are set up later, once hosting is decided (O-01).
#
# Easiest way to use it is through the Makefile at the repository root:
#   make up        start everything (database, Redis, API, worker, scheduler)
#   make services  start only the database and Redis (when you run Django yourself)
#   make logs      watch the backend logs (sign-up emails are printed there)
#   make down      stop everything (your data is kept)
#
# Settings come from backend/.env.example, then backend/.env (yours, never committed) if it
# exists. Inside Docker the database and Redis are reached by service name, so the
# "environment" blocks below override the localhost addresses used outside Docker.
# Ports are published on 127.0.0.1 only, so nothing is reachable from other computers.

name: retentionos

x-env-files: &env-files
  - path: ../backend/.env.example
    required: true
  - path: ../backend/.env
    required: false

x-backend: &backend
  build:
    context: ../backend
    args:
      INSTALL_DEV: "true"
  env_file: *env-files
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
  volumes:
    # Your code is mounted into the container, so the API restarts by itself when you edit it.
    - ../backend:/app
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    env_file: *env-files
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    # appendonly: keep queued jobs on disk across restarts.
    # noeviction: never silently drop queued jobs when memory is full (Celery needs this).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    <<: *backend
    # Applies database changes (migrations) first, then starts Django's development server.
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - webhooks,sync,analytics,messaging,explain,default
      - -l
      - info
    depends_on:
      redis:
        condition: service_healthy
      # Healthy API = migrations applied.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination \"celery@$${HOSTNAME}\" --timeout 10"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  beat:
    <<: *backend
    # Starts scheduled jobs on time. The schedule is stored in the database (django-celery-beat).
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
