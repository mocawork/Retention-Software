# Dependabot: weekly pull requests that keep our packages up to date (technical.md §2.1, §16).
# Small (minor and patch) updates arrive together in one pull request per area; big (major)
# updates arrive one by one, because they can need code changes. Every update is merged
# only when CI is green. Security fixes are merged within 72 hours (technical.md §2.1).

version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Django stays on the 5.2 LTS line (technical.md §2.2). The move to the next LTS is a
      # planned task, not an automatic update.
      - dependency-name: django
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node.js stays on 22 LTS (technical.md §2.3), so its type definitions stay on 22 too.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Python stays on 3.12 until it is re-checked at milestone M9 (technical.md §2.2).
      # Fresh 3.12 images (security patches) still arrive.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
